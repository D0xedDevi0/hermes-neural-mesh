name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests on a bare interpreter (no Hermes, no network, no credentials)
        run: python -m unittest discover -s tests -v

  trust:
    name: trust gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No compiled artifacts, no credential material
        run: python scripts/trust_check.py
